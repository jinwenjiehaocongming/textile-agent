# 纺织 B2B 智能客服 — docker compose
# 用法：
#   docker compose up --build          # 构建镜像并启动（首次构建会下载 HF 模型，较慢）
#   docker compose up --build --build-arg DOWNLOAD_MODELS=0   # 跳过模型下载，容器内挂载 HF 缓存
services:
  app:
    build:
      context: .
      args:
        DOWNLOAD_MODELS: ${DOWNLOAD_MODELS:-1}
    ports:
      - "8005:8005"
    env_file:
      - .env
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/study1
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./index:/app/index          # BM25 索引 + Qdrant LocalMode 备份
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: study1
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  hf_cache:
  pg_data:
  qdrant_data: