# 纺织 B2B 交易智能体 — docker compose
# 用法：
#   docker compose up --build          # 构建并启动（首次构建下载 embedding 模型 ~0.4GB）
#   docker compose up --build --build-arg DOWNLOAD_MODELS=0   # 跳过模型下载（挂载 HF 缓存）
#
# 容器入口 scripts/docker_entrypoint.sh 会自动完成：
#   等 PG/Qdrant → 建表 + 管理员 → 灌知识索引 → 启动（无需手动跑脚本）
services:
  app:
    build:
      context: .
      args:
        DOWNLOAD_MODELS: ${DOWNLOAD_MODELS:-1}
    ports:
      # 加反向代理(nginx/caddy)时改成 "127.0.0.1:8005:8005"，只让本机/代理访问
      - "8005:8005"
    env_file:
      - .env
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/study1
      - QDRANT_URL=http://qdrant:6333
      # L1 热缓存：连不上会 fail-open 降级进程内缓存（不阻塞启动，故不依赖 healthcheck）
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ./index:/app/index          # BM25 索引（entrypoint 自动生成，落宿主机便于备份）
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 240s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      # 生产请改强密码，并同步 app 的 DATABASE_URL
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: study1
    ports:
      - "127.0.0.1:5432:5432"   # 仅本机可连（调试）；数据库绝不暴露公网
    volumes:
      - pg_data:/var/lib/postgresql/data
      # 首次初始化自动灌入产品种子（281 条；已初始化过的卷不重跑）
      - ./sql/001_products.sql:/docker-entrypoint-initdb.d/001_products.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    # 生产建议 pin 稳定版本（如 qdrant/qdrant:v1.12.4）
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"   # 仅本机可连（调试）；向量库绝不暴露公网
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    # 同时承担两个用途，**运维等级不同**：
    # - study1:chat:*  热缓存：纯缓存，可丢（丢了回源 PG）
    # - study1:auth:*  refresh 会话：**不可丢**（丢了等于全员掉线）→ 生产务必开 AOF，
    #   并考虑与缓存分实例/分库。这里为本地演示开了 appendonly。
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb",
              "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"   # 仅本机可连（调试）
    volumes:
      - redis_data:/data        # AOF 落盘：会话不可丢；纯缓存部分丢了也无所谓
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  hf_cache:
  pg_data:
  qdrant_data:
  redis_data:
